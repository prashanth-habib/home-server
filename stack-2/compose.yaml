services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    # Optional - specify the uid and gid you would like Jellyfin to use instead of root
    user: 1000:1000
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - config:/config
      - cache:/cache
      # Optional media mounts (set MOVIES_DIR/SHOWS_DIR in .env)
      # Use absolute host paths for these variables.
      # - type: bind
      #   source: ${MOVIES_DIR}
      #   target: /movies
      # - type: bind
      #   source: ${SHOWS_DIR}
      #   target: /shows
      #   read_only: true
    restart: 'unless-stopped'
    # Optional - alternative address used for autodiscovery
    environment:
      - JELLYFIN_PublishedServerUrl=http://jellyfin.home.lan
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    # extra_hosts:
    #   - 'host.docker.internal:host-gateway'

volumes:
  config:
    name: jellyfin-config
  cache:
    name: jellyfin-cache